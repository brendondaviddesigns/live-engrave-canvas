<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#121212" />
  
  <!-- Technical Grid/Blueprint Details -->
  <g stroke="#2A2A2A" stroke-width="0.5">
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <circle cx="200" cy="200" r="150" fill="none" />
    <circle cx="200" cy="200" r="100" fill="none" />
  </g>
  
  <!-- Gears Geometry Section -->
  <!-- Gear 1: 30-tooth (larger) -->
  <g transform="translate(160, 140) scale(0.8)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#E5E5E5" stroke-width="1.5" />
    <!-- 5 Open Apertures -->
    <g fill="#121212" stroke="#E5E5E5" stroke-width="1">
      <path d="M -15,-45 A 45,45 0 0 1 15,-45 L 5,-20 A 20,20 0 0 0 -5,-20 Z" transform="rotate(0)" />
      <path d="M -15,-45 A 45,45 0 0 1 15,-45 L 5,-20 A 20,20 0 0 0 -5,-20 Z" transform="rotate(72)" />
      <path d="M -15,-45 A 45,45 0 0 1 15,-45 L 5,-20 A 20,20 0 0 0 -5,-20 Z" transform="rotate(144)" />
      <path d="M -15,-45 A 45,45 0 0 1 15,-45 L 5,-20 A 20,20 0 0 0 -5,-20 Z" transform="rotate(216)" />
      <path d="M -15,-45 A 45,45 0 0 1 15,-45 L 5,-20 A 20,20 0 0 0 -5,-20 Z" transform="rotate(288)" />
    </g>
    <!-- Center Bore -->
    <circle cx="0" cy="0" r="8" fill="#121212" stroke="#E5E5E5" stroke-width="1" />
  </g>
  
  <!-- Gear 2: 22-tooth (smaller, interlocking) -->
  <g transform="translate(240, 160) scale(0.6)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#E5E5E5" stroke-width="1.5" />
    <!-- 5 Open Apertures -->
    <g fill="#121212" stroke="#E5E5E5" stroke-width="1">
      <path d="M -12,-35 A 35,35 0 0 1 12,-35 L 4,-15 A 15,15 0 0 0 -4,-15 Z" transform="rotate(36)" />
      <path d="M -12,-35 A 35,35 0 0 1 12,-35 L 4,-15 A 15,15 0 0 0 -4,-15 Z" transform="rotate(108)" />
      <path d="M -12,-35 A 35,35 0 0 1 12,-35 L 4,-15 A 15,15 0 0 0 -4,-15 Z" transform="rotate(180)" />
      <path d="M -12,-35 A 35,35 0 0 1 12,-35 L 4,-15 A 15,15 0 0 0 -4,-15 Z" transform="rotate(252)" />
      <path d="M -12,-35 A 35,35 0 0 1 12,-35 L 4,-15 A 15,15 0 0 0 -4,-15 Z" transform="rotate(324)" />
    </g>
    <!-- Center Bore -->
    <circle cx="0" cy="0" r="6" fill="#121212" stroke="#E5E5E5" stroke-width="1" />
  </g>

  <!-- Separated BD Monogram -->
  <g transform="translate(200, 280)">
    <!-- B -->
    <text x="-60" y="0" font-family="Playfair Display, serif" font-size="80" font-weight="bold" fill="#E5E5E5" text-anchor="middle">B</text>
    <!-- D -->
    <text x="60" y="0" font-family="Playfair Display, serif" font-size="80" font-weight="bold" fill="#E5E5E5" text-anchor="middle">D</text>
    
    <!-- Crosshairs for Monogram Alignment -->
    <g stroke="#007AFF" stroke-width="0.5" opacity="0.6">
      <line x1="-100" y1="-40" x2="100" y2="-40" />
      <line x1="-100" y1="10" x2="100" y2="10" />
      <line x1="-60" y1="-50" x2="-60" y2="20" />
      <line x1="60" y1="-50" x2="60" y2="20" />
    </g>
  </g>

  <!-- Brand Label -->
  <text x="200" y="360" font-family="Inter, sans-serif" font-size="12" font-weight="300" fill="#E5E5E5" text-anchor="middle" letter-spacing="4">BRENDON DAVID DESIGNS</text>
  <text x="200" y="375" font-family="Inter, sans-serif" font-size="8" font-weight="300" fill="#007AFF" text-anchor="middle" letter-spacing="2">DIGITAL ATELIER • AUTHENTIC GEARS</text>

</svg>